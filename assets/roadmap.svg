<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="746" viewBox="0 0 1280 746" role="img" aria-labelledby="title desc">
  <title id="title">Ermik roadmap: four GitHub milestones</title>
  <desc id="desc">Issue progress as of 4 November 2026: v0.2.0 has 17 of 21 issues closed; v0.3.0 has 4 of 5 closed; v0.4.0 and v0.5.0 each have 0 of 4 closed. Ermik turns admitted, path-scoped issues into one draft pull request, with exact-HEAD review and maintainer-controlled merge.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#0b182a"/>
      <stop offset="1" stop-color="#122b3c"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop offset="0" stop-color="#60d3ba"/>
      <stop offset="1" stop-color="#77c6ed"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .eyebrow { fill:#8ca6ba; font-size:15px; font-weight:700; letter-spacing:2.4px; }
      .title { fill:#f3fbff; font-size:43px; font-weight:750; letter-spacing:-1.1px; }
      .sub { fill:#a9c0cd; font-size:18px; }
      .version { fill:#64d7c2; font-size:25px; font-weight:750; }
      .name { fill:#f1f8fb; font-size:24px; font-weight:700; }
      .detail { fill:#a9bfcc; font-size:17px; }
      .count { fill:#f2fbff; font-size:22px; font-weight:700; text-anchor:end; }
      .status { fill:#9bb4c2; font-size:14px; text-anchor:end; }
      .footer { fill:#d7e9ee; font-size:17px; font-weight:600; }
      .source { fill:#8ca6ba; font-size:14px; }
    </style>
  </defs>

  <rect width="1280" height="746" rx="26" fill="url(#bg)"/>
  <circle cx="1170" cy="-64" r="282" fill="#286779" opacity=".13"/>
  <circle cx="46" cy="765" r="244" fill="#1d6880" opacity=".10"/>

  <text x="56" y="57" class="eyebrow">ERMIK  /  THE PATH AHEAD</text>
  <text x="56" y="111" class="title">A verified path from issue to PR</text>
  <text x="57" y="146" class="sub">Milestone progress tracks closed GitHub issues, not release readiness.</text>

  <g>
    <rect x="52" y="177" width="1176" height="111" rx="17" fill="#183449" stroke="#2a5062"/>
    <rect x="52" y="177" width="5" height="111" rx="2.5" fill="#64d7c2"/>
    <text x="78" y="216" class="version">v0.2.0</text>
    <text x="219" y="216" class="name">Recovery and release gates</text>
    <text x="220" y="244" class="detail">Write recovery and credential split proven; live upgrade and host trials remain.</text>
    <text x="1197" y="215" class="count">17 / 21</text>
    <text x="1197" y="242" class="status">ISSUES CLOSED</text>
    <rect x="220" y="263" width="977" height="5" rx="2.5" fill="#315263"/>
    <rect x="220" y="263" width="791" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <g>
    <rect x="52" y="300" width="1176" height="111" rx="17" fill="#183449" stroke="#2a5062"/>
    <rect x="52" y="300" width="5" height="111" rx="2.5" fill="#64d7c2"/>
    <text x="78" y="339" class="version">v0.3.0</text>
    <text x="219" y="339" class="name">Portable review evidence</text>
    <text x="220" y="367" class="detail">Cross-host transfer shown; restricted receiver and image checks remain.</text>
    <text x="1197" y="338" class="count">4 / 5</text>
    <text x="1197" y="365" class="status">ISSUES CLOSED</text>
    <rect x="220" y="386" width="977" height="5" rx="2.5" fill="#315263"/>
    <rect x="220" y="386" width="782" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <g>
    <rect x="52" y="423" width="1176" height="111" rx="17" fill="#152f41" stroke="#28495b"/>
    <rect x="52" y="423" width="5" height="111" rx="2.5" fill="#63889c"/>
    <text x="78" y="462" class="version" fill="#9fc4d2">v0.4.0</text>
    <text x="219" y="462" class="name">Measured routing</text>
    <text x="220" y="490" class="detail">Compare outcomes, quota observations and cost per accepted PR.</text>
    <text x="1197" y="461" class="count">0 / 4</text>
    <text x="1197" y="488" class="status">ISSUES CLOSED</text>
    <rect x="220" y="509" width="977" height="5" rx="2.5" fill="#315263"/>
  </g>

  <g>
    <rect x="52" y="546" width="1176" height="111" rx="17" fill="#152f41" stroke="#28495b"/>
    <rect x="52" y="546" width="5" height="111" rx="2.5" fill="#63889c"/>
    <text x="78" y="585" class="version" fill="#9fc4d2">v0.5.0</text>
    <text x="219" y="585" class="name">Operator view and adoption</text>
    <text x="220" y="613" class="detail">Optional queue view, useful diagnostics and real-project trials.</text>
    <text x="1197" y="584" class="count">0 / 4</text>
    <text x="1197" y="611" class="status">ISSUES CLOSED</text>
    <rect x="220" y="632" width="977" height="5" rx="2.5" fill="#315263"/>
  </g>

  <circle cx="65" cy="692" r="5" fill="#64d7c2"/>
  <text x="79" y="698" class="footer">Scoped admission</text>
  <circle cx="305" cy="692" r="5" fill="#64d7c2"/>
  <text x="319" y="698" class="footer">One draft PR</text>
  <circle cx="513" cy="692" r="5" fill="#64d7c2"/>
  <text x="527" y="698" class="footer">Exact-HEAD review</text>
  <circle cx="789" cy="692" r="5" fill="#64d7c2"/>
  <text x="803" y="698" class="footer">Maintainer-controlled merge</text>
  <text x="1226" y="730" class="source" text-anchor="end">GitHub milestones · 4 Nov 2026</text>
</svg>
